name: Build OpenYoink with automatic scans
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Download reviewed OpenYoink source
        uses: actions/checkout@v4
        with:
          repository: MuQY1818/OpenYoink
          ref: 4ea503eb60c907bfbf2ee6730ccaf5ddf7d8a3dd
          path: source
          persist-credentials: false
      - name: Add automatic scans feature
        working-directory: source
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import base64, hashlib, subprocess, zlib
          patch = zlib.decompress(base64.b64decode(""))
          assert hashlib.sha256(patch).hexdigest() == "1b1d4eb0d1fc5e048662fc343bc892b7e59a261c565d90eb3e146593fba360e8"
          subprocess.run(["git", "apply", "--check", "-"], input=patch, check=True)
          subprocess.run(["git", "apply", "-"], input=patch, check=True)
          PYTHON
      - name: Check PDF importer
        working-directory: source
        run: |
          swiftc -swift-version 6 OpenYoink/Services/ScanFolderImporter.swift Scripts/ScanFolderSmoke.swift -o "$RUNNER_TEMP/scan-smoke"
          "$RUNNER_TEMP/scan-smoke"
      - name: Build the app for Apple silicon
        working-directory: source
        run: |
          xcodebuild -version
          xcodebuild -project Open-Yoink.xcodeproj -scheme OpenYoink -configuration Release -destination 'platform=macOS' -derivedDataPath build ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= build
      - name: Run unit tests
        working-directory: source
        run: |
          xcodebuild -project Open-Yoink.xcodeproj -scheme OpenYoink -configuration Debug -destination 'platform=macOS' -derivedDataPath build ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= test -only-testing:OpenYoinkTests
      - name: Make drag-to-Applications installer
        shell: bash
        run: |
          mkdir -p installer downloads
          ditto source/build/Build/Products/Release/OpenYoink.app installer/OpenYoink.app
          codesign --verify --deep --strict --verbose=2 installer/OpenYoink.app
          ln -s /Applications installer/Applications
          cp source/LICENSE installer/LICENSE.txt
          cp source/THIRD_PARTY_NOTICES.md installer/THIRD-PARTY-NOTICES.txt
          cat > installer/START-HERE.txt <<'GUIDE'
          OpenYoink with automatic scan import

          1. Quit your existing OpenYoink, if running. Keep a backup of the old app.
          2. Drag OpenYoink onto Applications. Replace the previous copy if asked.
          3. Open OpenYoink from Applications. This free custom build is not Apple-notarised.
             If macOS blocks it, use System Settings > Privacy & Security > Open Anyway
             after confirming this is the build you requested. Do not disable Gatekeeper.
          4. Open OpenYoink Settings > General > Automatic scan import.
          5. Click Choose Scans Folder and select Desktop/Scans (or your chosen folder).
          6. Enable Launch OpenYoink at login and Enable Side Shelf.
          7. Set your scanner's save destination to that SAME folder and choose PDF format.

          The folder picker tells OpenYoink where to watch. It does not change your scanner settings.
          After a PDF stops changing for at least 10 seconds and passes validation, it appears in the shelf.
          Originals stay in your scan folder. Existing PDFs in that folder also import.
          Test a full multi-page scan before relying on this feature.
          Keep OpenYoink running. This custom build is updated manually.
          GUIDE
          hdiutil create -volname 'OpenYoink Scans' -srcfolder installer -ov -format UDZO downloads/OpenYoink-Scans.dmg
          shasum -a 256 downloads/OpenYoink-Scans.dmg > downloads/SHA256.txt
      - name: Publish the download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Download **OpenYoink-Scans.dmg** below. Open it and drag OpenYoink onto Applications.

          Open OpenYoink Settings → General → Automatic scan import → Choose Scans Folder.
          Choose the same folder your scanner saves PDFs into. Enable launch at login.

          This is a custom OpenYoink build for Apple-silicon Macs running macOS 15 or later.
          It preserves scan originals. It is locally signed, not Apple-notarised; macOS may require
          Privacy & Security → Open Anyway on first launch. Test your real scanner after setup.
          Automatic upstream updates are disabled to preserve the scan-import feature.

          Built from MuQY1818/OpenYoink commit 4ea503eb60c907bfbf2ee6730ccaf5ddf7d8a3dd
          with the scan-folder patch embedded in this repository's build workflow.
          PDF helper smoke checks and unit tests must pass before this download is published.
          NOTES
          gh release create "scans-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" downloads/OpenYoink-Scans.dmg downloads/SHA256.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'OpenYoink with automatic scans' --notes-file "$RUNNER_TEMP/release-notes.md" --latest
